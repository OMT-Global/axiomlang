name: Extended Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: extended-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
  GO_VERSION: '1.26.5'
  RUST_VERSION: '1.90.0'

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Extended Validation Scope
    runs-on: ['self-hosted', 'linux', 'shell-only', 'public']
    outputs:
      app: ${{ steps.preset.outputs.app || steps.filter.outputs.app || 'false' }}
      ci: ${{ steps.preset.outputs.ci || steps.filter.outputs.ci || 'false' }}
      extended: ${{ steps.preset.outputs.extended || steps.filter.outputs.extended || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-05-30
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Run full suite for nightly or manual invocations
        id: preset
        if: github.event_name != 'push'
        run: |
          cat >>"$GITHUB_OUTPUT" <<'EOF'
          app=true
          ci=true
          extended=true
          EOF

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3 pinned 2026-05-30
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            app:
              - 'Makefile'
              - 'project.bootstrap.yaml'
              - 'AGENTS.md'
              - 'CONTRIBUTING.md'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.githooks/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'docs/bootstrap/**'
              - 'README.md'
              - 'docs/**'
            ci:
              - 'Makefile'
              - 'project.bootstrap.yaml'
              - 'AGENTS.md'
              - 'CONTRIBUTING.md'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.githooks/**'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'docs/bootstrap/**'
              - '.env.example'
              - 'CODEOWNERS'
            extended:
              - 'Makefile'
              - 'stage1/**'
              - 'docs/production-language-roadmap.md'
              - 'docs/production-language-readiness.json'
              - 'docs/roadmap*.md'
              - 'infra/**'
              - 'ops/**'

  fast-checks:
    name: Fast Checks
    runs-on: ['self-hosted', 'linux', 'shell-only', 'public']
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-05-30

      - name: Run fast checks
        run: bash scripts/ci/run-fast-checks.sh

  extended-checks:
    name: Extended Checks
    runs-on: ['self-hosted', 'linux', 'shell-only', 'public']
    timeout-minutes: 120
    needs: changes
    if: needs.changes.outputs.extended == 'true' || needs.changes.outputs.app == 'true'
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AXIOM_QUALIFICATION_OUTPUT_DIR: artifacts/toolchain-qualification
      AXIOM_QUALIFICATION_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
      AXIOM_QUALIFICATION_TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-05-30
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable pinned 2026-04-19
        with:
          components: llvm-tools-preview

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6 pinned 2026-07-27
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Ensure pinned coverage tooling
        run: |
          required_version="0.8.5"
          installed_version="$(cargo llvm-cov --version 2>/dev/null || true)"
          if [[ "$installed_version" != "cargo-llvm-cov $required_version" ]]; then
            cargo install cargo-llvm-cov --version "$required_version" --locked --force
          fi
          test "$(cargo llvm-cov --version)" = "cargo-llvm-cov $required_version"

      - name: Run extended validation
        run: >-
          bash scripts/ci/run-extended-validation.sh
          --head-sha '${{ github.sha }}'
          --target '${{ runner.os }}-${{ runner.arch }}'
          --trigger '${{ github.event_name }}'

      - name: Summarize qualification evidence
        if: always()
        run: >-
          python3 scripts/ci/report-toolchain-qualification.py
          --evidence artifacts/toolchain-qualification/toolchain-qualification.json
          --expected-head-sha '${{ github.sha }}'

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 pinned 2026-04-19
        with:
          name: toolchain-qualification-${{ github.sha }}
          path: artifacts/toolchain-qualification
          if-no-files-found: error

  target-support-evidence:
    name: Target Support Evidence (${{ matrix.platform }})
    needs: changes
    if: (needs.changes.outputs.extended == 'true' || needs.changes.outputs.app == 'true') && github.ref == 'refs/heads/main' && github.repository == 'OMT-Global/axiomlang'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86-64
            target: x86_64-unknown-linux-gnu
            runner: '["self-hosted", "linux", "shell-only", "public"]'
          # The job-level main-ref and repository gate keeps manual dispatches
          # from sending unreviewed branch code to the private native pool.
          - platform: macos-arm64
            target: aarch64-apple-darwin
            runner: '["self-hosted", "private", "macOS", "ARM64", "xcode"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/axiom-target-evidence-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-05-30
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable pinned 2026-04-19
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path stage1/Cargo.toml

      - name: Produce exact-head target evidence
        run: >-
          python3 scripts/ci/run-target-support-evidence-v1.py run
          --expected-target '${{ matrix.target }}'
          --head-sha '${{ github.sha }}'
          --trigger '${{ github.event_name }}'
          --runner-labels-json '${{ matrix.runner }}'
          --output 'artifacts/target-support/${{ matrix.platform }}.json'

      - name: Upload target support evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 pinned 2026-04-19
        with:
          name: target-support-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/target-support/${{ matrix.platform }}.json
          if-no-files-found: error

  validate-secrets:
    name: Validate Secrets
    runs-on: ['self-hosted', 'linux', 'shell-only', 'public']
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned 2026-05-30
      - name: Scan repository for secret patterns
        run: bash scripts/check-detect-secrets.sh --all-files

  extended-validation-gate:
    name: Extended Validation Gate
    runs-on: ['self-hosted', 'linux', 'shell-only', 'public']
    if: always()
    needs:
      - changes
      - fast-checks
      - extended-checks
      - target-support-evidence
      - validate-secrets
    steps:
      - name: Check extended validation jobs
        env:
          RESULTS: >-
            changes=${{ needs.changes.result }}
            fast-checks=${{ needs.fast-checks.result }}
            extended-checks=${{ needs.extended-checks.result }}
            target-support-evidence=${{ needs.target-support-evidence.result }}
            validate-secrets=${{ needs.validate-secrets.result }}
        run: |
          failed=0
          for entry in $RESULTS; do
            job="${entry%%=*}"
            status="${entry##*=}"
            if [[ "$status" == "success" || "$status" == "skipped" ]]; then
              echo "OK   $job => $status"
            else
              echo "FAIL $job => $status"
              failed=1
            fi
          done
          exit "$failed"
